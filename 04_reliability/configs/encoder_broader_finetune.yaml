experiment_id: broader_full_finetune
enabled: false
description: Full ResNet-50 fine-tuning candidate; disabled until frozen and final-block experiments justify the added variance/cost.
model:
  backbone: RN50
  pretrained: true
  embedding_size: 8
  dropout: 0.2
preprocessing:
  color_mode: RGB
  resize_shorter_side: 256
  crop_size: 224
  normalization:
    name: ImageNet
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
training_augmentation:
  enabled: true
  rotation_degrees: 3.0
  translate_fraction: [0.02, 0.02]
  scale_range: [0.98, 1.02]
  horizontal_flip: false
fine_tuning:
  mode: full
  final_mode: full
optimization:
  optimizer: AdamW
  batch_size: 16
  max_epochs: 30
  final_epochs: 15
  head_learning_rate: 0.00005
  backbone_learning_rate: 0.000001
  weight_decay: 0.0001
  early_stopping_patience: 5
loss_weights:
  task: 1.0
  concept: 0.1
  neural: 0.1
  concept_task: 0.0
