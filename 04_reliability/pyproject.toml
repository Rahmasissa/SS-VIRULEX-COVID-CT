[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ss-virulex-reliability"
version = "0.1.0"
description = "Leakage audits and fold-safe SS-VIRULEX experimentation"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["ss_virulex_reliability*"]
